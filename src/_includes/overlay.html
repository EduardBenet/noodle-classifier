{% import "macros.njk" as ui %}
<div id="overlay">
    <div id="overlay-card">
        <div class="overlay-actions">
            <button id="overlay-share" title="Share">🔗</button>
            <button id="overlay-edit" title="Edit" hidden>✏️</button>
            <button id="overlay-close">✕</button>
        </div>
        <h2 id="overlay-title"></h2>
        <div id="overlay-body"></div>
        <form id="rating-widget" hidden>
            <div class="rating-widget-heading">Your rating</div>
            {{ ui.ratingPicker("my-rating", "Rating:") }}
            {{ ui.spicePicker("my-spice", "Spice:") }}
            <div class="rating-widget-footer">
                <button type="submit" id="rating-submit" disabled>Save rating</button>
                <span id="rating-status" role="status"></span>
            </div>
        </form>
    </div>
</div>
