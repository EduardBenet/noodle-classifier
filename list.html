<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Noodle List 🍜</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <a href="index.html" class="site-brand">🍜 Noodle Classifier</a>
        <div class="header-actions">
            <div id="nav-menu">
                <button id="nav-btn" aria-label="Navigation menu" title="Menu">☰</button>
                <div id="nav-dropdown" hidden>
                    <a href="list.html" aria-current="page">List</a>
                    <a href="add.html" id="nav-add" hidden>Add</a>
                </div>
            </div>
            <div id="auth-widget">
            <button id="auth-btn" title="Sign in" aria-label="Sign in">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
                <span>Sign in</span>
            </button>
            <div id="auth-menu" hidden>
                <div id="auth-menu-login">
                    <a href="/.auth/login/github?post_login_redirect_uri=/list">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.2-1.3-5.2-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 5.5 18.3 5.8 18.3 5.8c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.2 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6C20.2 21.4 23.5 17.1 23.5 12 23.5 5.7 18.3.5 12 .5z"/></svg>
                        Sign in with GitHub
                    </a>
                    <a href="/.auth/login/aad?post_login_redirect_uri=/list">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M11.5 2L2 7v10l9.5 5 9.5-5V7L11.5 2zm0 2.3 7.2 3.8-7.2 3.8-7.2-3.8 7.2-3.8zM4 9.2l7 3.7v7l-7-3.7V9.2zm9 10.7v-7l7-3.7v7l-7 3.7z"/></svg>
                        Sign in with Entra ID
                    </a>
                </div>
                <div id="auth-menu-user" hidden>
                    <span id="auth-username"></span>
                    <a href="/.auth/logout?post_logout_redirect_uri=/list">Sign out</a>
                </div>
            </div>
        </div>
        </div>
    </header>

    <div id="overlay">
        <div id="overlay-card">
            <div class="overlay-actions">
                <button id="overlay-edit" title="Edit" hidden>✏️</button>
                <button id="overlay-close">✕</button>
            </div>
            <h2 id="overlay-title"></h2>
            <div id="overlay-body"></div>
        </div>
    </div>

    <main>
        <div class="list-filters">
            <input type="text" id="search" placeholder="Search...">
            <select id="sort-by">
                <option value="">Sort by...</option>
                <option value="rating-desc">★ Rating (best first)</option>
                <option value="rating-asc">★ Rating (worst first)</option>
                <option value="spicy-desc">🌶️ Spiciest first</option>
                <option value="spicy-asc">🌶️ Mildest first</option>
                <option value="price-asc">£ Price (low → high)</option>
                <option value="price-desc">£ Price (high → low)</option>
            </select>
        </div>
        <div id="noodle-list"></div>
        <div id="pagination" hidden></div>
    </main>

    <div id="toast" hidden></div>

    <script src="assets/js/list.js"></script>
    <script src="assets/js/search.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
